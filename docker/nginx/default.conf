server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	server_tokens off;
	etag on;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

	error_page 404 /404.html;

	# HTML: siempre revalidar (con ETag), así los cambios se ven al momento.
	location / {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/index.html $uri.html =404;
	}

	# CSS, JS e imágenes de Astro llevan hash en el nombre: si cambian, cambia la URL.
	location /_astro/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# Sin hash en el nombre: 30 días. Si se reemplaza un vídeo, cambiarle el nombre (cafe-walk-v2.mp4).
	location ~ ^/(video|fonts)/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=2592000" always;
		add_header Access-Control-Allow-Origin "*" always;
		try_files $uri =404;
	}

	location ~* \.(ico|svg|jpg|png|webp)$ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=604800" always;
		try_files $uri =404;
	}

	location = /404.html {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache" always;
		internal;
	}
}
